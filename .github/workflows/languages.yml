name: Update language files

on:
  workflow_dispatch:
  schedule:
    # Check CTAN every Monday. The non-round time avoids peak scheduler load.
    - cron: '17 6 * * 1'

concurrency:
  group: update-language-files
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update language files
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scheduled workflows in forks should not create update pull requests.
    if: github.event_name != 'schedule' || github.repository == 'vanderlee/phpSyllable'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: curl
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Download current language files
        id: languages
        env:
          MAX_REDIRECTS: 5
        shell: bash
        run: |
          ./build/update-language-files

          if git diff --quiet -- languages; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Test updated language files
        if: steps.languages.outputs.changed == 'true'
        run: ./vendor/bin/phpunit

      - name: Commit and push updates
        if: steps.languages.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: automation/update-language-files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git switch -C "$UPDATE_BRANCH"
          git add languages
          git commit -m 'Update language files'

          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null; then
            git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          fi

          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Open or refresh update pull request
        if: steps.languages.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-language-files
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          pr_url="$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url')"

          if [ -z "$pr_url" ]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title 'Update language files' \
              --body 'Automated update of the language definition files from their upstream CTAN sources.'
          else
            echo "Updated existing pull request: $pr_url"
          fi

      - name: Summarize result
        env:
          CHANGED: ${{ steps.languages.outputs.changed }}
        shell: bash
        run: |
          if [ "$CHANGED" = 'true' ]; then
            echo 'Updated language files were tested and published to the automation branch.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'All language files are already current.' >> "$GITHUB_STEP_SUMMARY"
          fi
